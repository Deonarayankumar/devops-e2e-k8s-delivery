namespace: shop

images:
  frontend:
    repository: demoregistry.azurecr.io/shop-frontend
    tag: "2026.07.01"
    pullPolicy: IfNotPresent
  backend:
    repository: demoregistry.azurecr.io/shop-backend
    tag: "2026.07.01"
    pullPolicy: IfNotPresent

frontend:
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

backend:
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  env:
    APP_NAME: order-api
    OTEL_SERVICE_NAME: order-api
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317

strategy: rolling # rolling | canary | blueGreen

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuAverageUtilization: 70

pdb:
  minAvailable: 1

gateway:
  enabled: true
  name: shop-gateway
  listenerPort: 80
  hostname: shop.example.com

networkPolicy:
  enabled: true
