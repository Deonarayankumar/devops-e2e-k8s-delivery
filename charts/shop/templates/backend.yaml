{{- if eq .Values.strategy "rolling" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: shop-backend
    {{ include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: shop-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: shop-backend
        {{ include "shop.labels" . | nindent 8 }}
    spec:
      serviceAccountName: shop-backend
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: shop-backend
            - secretRef:
                name: shop-backend
          env:
            - name: BUILD_ID
              value: {{ .Values.images.backend.tag | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 8
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: shop-backend
    {{ include "shop.labels" . | nindent 4 }}
spec:
  selector:
    app: shop-backend
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.backend.port }}
