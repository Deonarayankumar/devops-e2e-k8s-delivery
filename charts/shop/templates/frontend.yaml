apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: shop-frontend
    {{ include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: shop-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: shop-frontend
        {{ include "shop.labels" . | nindent 8 }}
    spec:
      serviceAccountName: shop-frontend
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shop-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: shop-frontend
    {{ include "shop.labels" . | nindent 4 }}
spec:
  selector:
    app: shop-frontend
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.frontend.port }}
