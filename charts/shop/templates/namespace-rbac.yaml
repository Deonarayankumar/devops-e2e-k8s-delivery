apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    {{ include "shop.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{ include "shop.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{ include "shop.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-backend-reader
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-backend-reader
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: shop-backend
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-backend-reader
