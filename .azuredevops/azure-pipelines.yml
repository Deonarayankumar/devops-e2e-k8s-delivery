trigger:
  branches:
    include: [main]

variables:
  imageRepository: order-service
  containerRegistry: demoregistry.azurecr.io
  helmChartPath: helm/order-service

stages:
  - stage: Build
    jobs:
      - job: BuildPush
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: Docker@2
            displayName: Build and push
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: app/Dockerfile
              buildContext: app
              tags: |
                $(Build.BuildId)
                latest
          - publish: $(helmChartPath)
            artifact: helm-chart

  - stage: DeployStaging
    dependsOn: Build
    jobs:
      - deployment: Staging
        environment: aks-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: helm-chart
                - task: HelmDeploy@0
                  inputs:
                    command: upgrade
                    chartType: FilePath
                    chartPath: $(Pipeline.Workspace)/helm-chart
                    releaseName: order-service
                    overrideValues: image.tag=$(Build.BuildId)
                    valueFile: $(Pipeline.Workspace)/helm-chart/values-staging.yaml
                    namespace: staging
                - script: ./scripts/smoke-test.sh $(STAGING_URL)
                  displayName: Smoke test

  - stage: DeployProduction
    dependsOn: DeployStaging
    jobs:
      - deployment: Production
        environment: aks-production-approval
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: helm-chart
                - task: HelmDeploy@0
                  inputs:
                    command: upgrade
                    chartType: FilePath
                    chartPath: $(Pipeline.Workspace)/helm-chart
                    releaseName: order-service
                    overrideValues: image.tag=$(Build.BuildId)
                    valueFile: $(Pipeline.Workspace)/helm-chart/values-prod.yaml
                    namespace: production
